name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # ubuntu runner 自带 Android SDK，但编译用的 platform/build-tools 不一定齐
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain \
            -Pdsh.url="${DSH_URL:-http://192.168.1.100:8787/}"

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/DSHLanControl-${GITHUB_REF_NAME:-dev}-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: DSHLanControl-debug
          path: out/*.apk
          if-no-files-found: error

      # 打 tag 时把 APK 挂到对应 Release
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
